[package]
name = "rw-subpage"
version = "8.0.1"
edition = "2021"
description = "Remnawave Subscription Page"
license = "AGPL-3.0-only"
repository = "https://github.com/remnawave/subscription-page"
publish = false

[lib]
name = "rw_subpage"
path = "src/lib.rs"

[[bin]]
name = "rw-subpage"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-graceful", "service"] }
ipnet = "2"
jsonwebtoken = "9"
percent-encoding = "2"
rand = "0.8"
socket2 = "0.5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["json", "http1", "tokio"] }
